{%- assign medium = include.medium | default: 'home' -%}
{%- assign campaign = include.campaign | default: 'cta_band' -%}
<section class="cta-band" aria-labelledby="cta-band-title">
  <div class="wrap cta-band-inner">
    <div>
      <p class="eyebrow">WildGPT 官网</p>
      <h2 id="cta-band-title">支付宝、微信付款，直充你自己的 ChatGPT 账号</h2>
      <p>不必提供账号密码。选好套餐后按订单页提交信息，进度可查，订阅期内售后持续跟进。</p>
    </div>
    <a class="btn btn-primary btn-lg" href="{{ site.brand_site }}/zh/?utm_source=githubpages&amp;utm_medium={{ medium }}&amp;utm_campaign={{ campaign }}">前往 WildGPT 官网</a>
  </div>
</section>
